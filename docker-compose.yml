services:
  postgres:
    image: postgres:16
    container_name: origentours-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-origentours}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env de la raiz}
      POSTGRES_DB: ${POSTGRES_DB:-origentours}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - origentours_pgdata:/var/lib/postgresql/data

volumes:
  origentours_pgdata: