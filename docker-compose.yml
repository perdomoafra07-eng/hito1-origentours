services:
  postgres:
    image: postgres:16
    container_name: origentours-postgres
    environment:
      POSTGRES_USER: origentours
      POSTGRES_PASSWORD: origentours
      POSTGRES_DB: origentours
    ports:
      - "5432:5432"
    volumes:
      - origentours_pgdata:/var/lib/postgresql/data

volumes:
  origentours_pgdata:
